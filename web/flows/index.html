<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remy Flows</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="../m3.css">
<!--
  Flows explorer: one toggle bar, one iframe. Each flow is its own page in this folder.
  URL hash = flow id (links work), last choice remembered in localStorage, ←/→ switches.
-->
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 0; height: 100vh; height: 100dvh; }
  .bar { position: sticky; top: 0; z-index: 10; flex: none; background: var(--md-surface-container); }
  .bar .m3-top-app-bar { position: static; background: transparent; min-height: 56px; padding: 8px 12px 4px 16px; }
  .tag { margin-left: 4px; }
  .desc { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 8px; }
  .desc b { color: var(--md-on-surface); font-weight: 500; }
  .ctrls { display: flex; gap: 0; flex: none; margin-left: auto; }
  .ctrls a { text-decoration: none; }
  .pills { display: flex; gap: 8px; padding: 4px 16px 12px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: none; height: 40px; }
  .pill .n { font: 500 11px/16px var(--md-font); color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; }
  .pill[aria-current="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }
  .pill[aria-current="true"] .n { color: inherit; }
  .badge { height: 20px; padding: 0 8px; font: 500 11px/16px var(--md-font); letter-spacing: .5px; text-transform: uppercase; }
  .note { padding: 0 16px 12px; margin-top: -4px; }
  .note code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--md-surface-container-highest); padding: 1px 6px; border-radius: var(--md-shape-xs); }
  .legend { display: flex; gap: 8px; align-items: center; flex: none; }
  .frame-wrap { flex: 1; min-height: 0; position: relative; background: var(--md-surface); border-top: 1px solid var(--md-outline-variant); }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 1; transition: opacity var(--md-dur-m) var(--md-ease); }
  iframe.loading { opacity: 0; }
  @media (max-width: 900px) { .legend { display: none; } }
  @media (max-width: 760px) { .desc { display: none; } .bar .m3-brand-name { display: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="m3-top-app-bar">
    <a class="m3-brand" href="/" aria-label="Remy home">
      <span class="m3-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span>
      <span class="m3-brand-name">Remy</span>
    </a>
    <span class="tag m3-status primary">Flows</span>
    <div class="desc body-m muted" id="desc" aria-live="polite"></div>
    <div class="legend body-s muted"><span class="badge m3-status success">Live</span> real backend <span class="badge m3-status">Mock</span> clickable mockup</div>
    <div class="ctrls">
      <button class="m3-icon-btn" id="prev" type="button" aria-label="Previous flow (←)"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button>
      <button class="m3-icon-btn" id="next" type="button" aria-label="Next flow (→)"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button>
      <button class="m3-icon-btn" id="replay" type="button" aria-label="Replay this flow"><span class="material-symbols-rounded" aria-hidden="true">replay</span></button>
      <a class="m3-icon-btn" id="open" href="#" target="_blank" rel="noopener" aria-label="Open this flow in a new tab"><span class="material-symbols-rounded" aria-hidden="true">open_in_new</span></a>
    </div>
  </div>
  <nav class="pills" id="pills" aria-label="Flows"></nav>
  <div class="note body-s muted" id="note" hidden></div>
</header>
<div class="frame-wrap"><iframe id="frame" title="Flow preview"></iframe></div>

<script>
const FLOWS = [
  { id: 'drop-go',    name: 'Drop & Go',       live: true,  desc: 'Drag your bill + insurance statement, press Go. No chat, no questions.',
    note: 'Demo patients under Go, from GET /api/examples: Raj (POST /api/cases?scenario=raj, shown disabled until his scenario is on the server), Marcus (scenario=freecare, UCSF, $5,600 → $0 free care) and Rosa (the sample bill).' },
  { id: 'chat',       name: 'Chat with Billie', desc: 'A warm conversational intake that ends with “Open my case”.' },
  { id: 'inbox',      name: 'Connect inbox',   desc: 'One click: we scan your inbox and find the bill and the EOB ourselves.' },
  { id: 'snap',       name: 'Snap it',         desc: 'Mobile: photograph the bill, photograph the EOB, watch $8,700 fall to $600.' },
  { id: 'talk',       name: 'Just talk',       desc: 'Hold the mic and tell us what happened. We turn it into a case.' },
  { id: 'forward',    name: 'Forward it',      desc: 'Forward the bill email to bills@remy.ai. The case starts itself.' },
  { id: 'one-screen', name: 'One screen',      desc: 'Everything happens in place: the number counts down while agents work.' },
  { id: 'receipt',    name: 'Receipt',         desc: 'The outcome as a shareable receipt: you owe $600, on a 6 × $100 interest-free plan.' },
  { id: 'sms',        name: 'Text it',         desc: 'No app: text a photo to Remy, get updates and approve by SMS.' },
  { id: 'caregiver',  name: 'For a parent',    desc: 'Built for caregivers handling a parent’s bill, with consent in one tap.' },
  { id: 'split',      name: 'Before / After',  desc: 'Drag the divider across the bill to see what you were charged vs. what you owe.' },
  { id: 'calm',       name: 'Calm mode',       desc: 'Large type, one thing per screen, read-aloud. Accessibility first.' },
];
const KEY = 'remy.flows.last';
const $ = (id) => document.getElementById(id);
const frame = $('frame'), pills = $('pills');
let current = null;

pills.innerHTML = FLOWS.map((f, i) =>
  `<button class="pill m3-chip" type="button" data-id="${f.id}" aria-current="false"><span class="n">${String(i + 1).padStart(2, '0')}</span>${f.name}` +
  `<span class="badge m3-status ${f.live ? 'success' : ''}">${f.live ? 'Live' : 'Mock'}</span></button>`).join('');

function store(id) { try { localStorage.setItem(KEY, id); } catch (e) {} }
function recall() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function byId(id) { return FLOWS.find((f) => f.id === id); }

function show(id, { push = true } = {}) {
  const f = byId(id) || FLOWS[0];
  if (current === f.id) return;
  current = f.id;
  frame.classList.add('loading');
  frame.src = f.id + '.html';
  $('open').href = f.id + '.html';
  $('desc').innerHTML = `<b>${f.name}</b> · ${f.desc}`;
  document.title = f.name + ' · Remy Flows';
  $('note').hidden = !f.note;
  $('note').innerHTML = f.note ? f.note.replace(/(POST \S+)/, '<code>$1</code>') : '';
  pills.querySelectorAll('.pill').forEach((p) => {
    const on = p.dataset.id === f.id;
    p.setAttribute('aria-current', on ? 'true' : 'false');
    if (on) p.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  store(f.id);
  if (push && location.hash.slice(1) !== f.id) history.replaceState(null, '', '#' + f.id);
}
function step(d) {
  const i = FLOWS.findIndex((f) => f.id === current);
  show(FLOWS[(i + d + FLOWS.length) % FLOWS.length].id);
}
function onKey(e) {
  const t = e.target, tag = t && t.tagName;
  if (e.metaKey || e.ctrlKey || e.altKey || tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
}

pills.addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (b) show(b.dataset.id); });
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('replay').onclick = () => { frame.classList.add('loading'); frame.src = current + '.html'; };
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', () => show(location.hash.slice(1), { push: false }));
frame.addEventListener('load', () => {
  frame.classList.remove('loading');
  // Keep ←/→ working while focus is inside the flow (same-origin).
  try { frame.contentWindow.document.addEventListener('keydown', onKey); } catch (e) {}
});

show(byId(location.hash.slice(1)) ? location.hash.slice(1) : (byId(recall()) ? recall() : FLOWS[0].id));
</script>
</body>
</html>
