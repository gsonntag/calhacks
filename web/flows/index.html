<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<!--
  Flows explorer: one toggle bar, one iframe. Each flow is its own page in this folder.
  URL hash = flow id (links work), last choice remembered in localStorage, ←/→ switches.
-->
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:0;height:100vh;background:#FFFFFF}
  .bar{position:sticky;top:0;z-index:10;flex:none;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair);box-shadow:0 6px 18px -16px rgba(150,40,45,.4)}
  .row1{display:flex;align-items:center;gap:12px;padding:10px 16px 6px}
  .row1 .logo b{font-size:17px}
  .tag{font-size:12px;font-weight:700;color:var(--muted-2);padding:4px 10px;border:1px solid var(--border);border-radius:999px;white-space:nowrap}
  .desc{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desc b{color:var(--ink);font-weight:700}
  .ctrls{display:flex;gap:4px;flex:none}
  .icon-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:999px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--muted);text-decoration:none;transition:background .2s}
  .icon-btn:hover{background:var(--tint);color:var(--ink)}
  .pills{display:flex;gap:6px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:#FFFFFF;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,box-shadow .2s}
  .pill:hover{background:var(--tint-2);color:var(--ink)}
  .pill .n{font-size:11px;font-weight:700;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .pill[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF;box-shadow:0 8px 20px -10px rgba(190,51,55,.7)}
  .pill[aria-current="true"] .n{color:#F7CFD0}
  .badge{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px}
  .badge.live{background:var(--green-bg);color:var(--green-ink);border:1px solid var(--green-border)}
  .badge.mock{background:#F5F2F2;color:var(--muted-2)}
  .pill[aria-current="true"] .badge.live{background:#FFFFFF;border-color:#FFFFFF}
  .pill[aria-current="true"] .badge.mock{background:rgba(255,255,255,.18);color:#FFFFFF}
  .note{padding:0 16px 10px;margin-top:-4px;font-size:12px;color:var(--muted-2);line-height:1.5}
  .note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--green-bg);color:var(--green-ink);padding:1px 6px;border-radius:6px}
  .legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted-2)}
  .frame-wrap{flex:1;min-height:0;position:relative;background:#FFFFFF}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;opacity:1;transition:opacity .25s}
  iframe.loading{opacity:0}
  @media (max-width:760px){ .desc,.legend{display:none} .row1{justify-content:space-between} }
</style>
</head>
<body>
<header class="bar">
  <div class="row1">
    <a class="logo" href="/" aria-label="BillBack home">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#BE3337"/><path d="M10 7h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 12h6M13 16h4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      <b>Bill<span>Back</span></b>
    </a>
    <span class="tag">Flows</span>
    <div class="desc" id="desc" aria-live="polite"></div>
    <div class="legend"><span class="badge live">Live</span> real backend <span class="badge mock">Mock</span> clickable mockup</div>
    <div class="ctrls">
      <button class="icon-btn" id="prev" type="button" aria-label="Previous flow (←)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="next" type="button" aria-label="Next flow (→)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="icon-btn" id="replay" type="button" aria-label="Replay this flow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <a class="icon-btn" id="open" href="#" target="_blank" rel="noopener" aria-label="Open this flow in a new tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a>
    </div>
  </div>
  <nav class="pills" id="pills" aria-label="Flows"></nav>
  <div class="note" id="note" hidden></div>
</header>
<div class="frame-wrap"><iframe id="frame" title="Flow preview"></iframe></div>

<script>
const FLOWS = [
  { id: 'drop-go',    name: 'Drop & Go',       live: true,  desc: 'Drag your bill + insurance statement, press Go. No chat, no questions.',
    note: 'Second live scenario: POST /api/cases?scenario=freecare (Marcus Lee, UCSF Medical Center, $5,600 → $0 free care: out-of-pocket is 12% of income). Try it from the link under Go.' },
  { id: 'chat',       name: 'Chat with Billie', desc: 'A warm conversational intake that ends with “Open my case”.' },
  { id: 'inbox',      name: 'Connect inbox',   desc: 'One click: we scan your inbox and find the bill and the EOB ourselves.' },
  { id: 'snap',       name: 'Snap it',         desc: 'Mobile: photograph the bill, photograph the EOB, watch $8,700 fall to $600.' },
  { id: 'talk',       name: 'Just talk',       desc: 'Hold the mic and tell us what happened. We turn it into a case.' },
  { id: 'forward',    name: 'Forward it',      desc: 'Forward the bill email to bills@billback.ai. The case starts itself.' },
  { id: 'one-screen', name: 'One screen',      desc: 'Everything happens in place: the number counts down while agents work.' },
  { id: 'receipt',    name: 'Receipt',         desc: 'The outcome as a shareable receipt: you owe $600, on a 6 × $100 interest-free plan.' },
  { id: 'sms',        name: 'Text it',         desc: 'No app: text a photo to BillBack, get updates and approve by SMS.' },
  { id: 'caregiver',  name: 'For a parent',    desc: 'Built for caregivers handling a parent’s bill, with consent in one tap.' },
  { id: 'split',      name: 'Before / After',  desc: 'Drag the divider across the bill to see what you were charged vs. what you owe.' },
  { id: 'calm',       name: 'Calm mode',       desc: 'Large type, one thing per screen, read-aloud. Accessibility first.' },
];
const KEY = 'billback.flows.last';
const $ = (id) => document.getElementById(id);
const frame = $('frame'), pills = $('pills');
let current = null;

pills.innerHTML = FLOWS.map((f, i) =>
  `<button class="pill" type="button" data-id="${f.id}" aria-current="false"><span class="n">${String(i + 1).padStart(2, '0')}</span>${f.name}` +
  `<span class="badge ${f.live ? 'live' : 'mock'}">${f.live ? 'Live' : 'Mock'}</span></button>`).join('');

function store(id) { try { localStorage.setItem(KEY, id); } catch (e) {} }
function recall() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function byId(id) { return FLOWS.find((f) => f.id === id); }

function show(id, { push = true } = {}) {
  const f = byId(id) || FLOWS[0];
  if (current === f.id) return;
  current = f.id;
  frame.classList.add('loading');
  frame.src = f.id + '.html';
  $('open').href = f.id + '.html';
  $('desc').innerHTML = `<b>${f.name}</b> · ${f.desc}`;
  document.title = f.name + ' · BillBack Flows';
  $('note').hidden = !f.note;
  $('note').innerHTML = f.note ? f.note.replace(/(POST \S+)/, '<code>$1</code>') : '';
  pills.querySelectorAll('.pill').forEach((p) => {
    const on = p.dataset.id === f.id;
    p.setAttribute('aria-current', on ? 'true' : 'false');
    if (on) p.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  store(f.id);
  if (push && location.hash.slice(1) !== f.id) history.replaceState(null, '', '#' + f.id);
}
function step(d) {
  const i = FLOWS.findIndex((f) => f.id === current);
  show(FLOWS[(i + d + FLOWS.length) % FLOWS.length].id);
}
function onKey(e) {
  const t = e.target, tag = t && t.tagName;
  if (e.metaKey || e.ctrlKey || e.altKey || tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
}

pills.addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (b) show(b.dataset.id); });
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('replay').onclick = () => { frame.classList.add('loading'); frame.src = current + '.html'; };
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', () => show(location.hash.slice(1), { push: false }));
frame.addEventListener('load', () => {
  frame.classList.remove('loading');
  // Keep ←/→ working while focus is inside the flow (same-origin).
  try { frame.contentWindow.document.addEventListener('keydown', onKey); } catch (e) {}
});

show(byId(location.hash.slice(1)) ? location.hash.slice(1) : (byId(recall()) ? recall() : FLOWS[0].id));
</script>
</body>
</html>
