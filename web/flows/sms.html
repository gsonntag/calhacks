<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text it · Remy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<!-- MOCK: no app, no website. Text a photo to Remy; everything (updates, approval) happens over SMS. -->
<style>
  .ch{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 10px;border-bottom:1px solid var(--hair)}
  .ch .av{width:46px;height:46px;border-radius:999px;background:var(--accent);display:flex;align-items:center;justify-content:center}
  .ch b{font-size:14px} .ch span{font-size:11px;color:var(--muted-2)}
  .msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
  .m{max-width:78%;padding:9px 13px;border-radius:20px;font-size:14.5px;line-height:1.45;animation:pop .3s var(--ease) both;transform-origin:bottom left}
  .m.them{align-self:flex-start;background:#F1EDED;color:var(--ink);border-bottom-left-radius:6px}
  .m.me{align-self:flex-end;background:var(--accent);color:#FFFFFF;border-bottom-right-radius:6px;transform-origin:bottom right}
  .m b{font-weight:700} .m .g{color:var(--green-ink);font-weight:800}
  .m.photo{padding:4px;background:transparent}
  .m.photo .pic{width:150px;height:110px;border-radius:16px;background:#FFFFFF;border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:5px;transform:rotate(-2deg)}
  .pic .h{font-size:8px;font-weight:800;color:var(--accent)} .pic i{display:block;height:4px;border-radius:4px;background:#ECE4E4}
  .pic .a{margin-top:auto;font-size:14px;font-weight:800}
  .m.card2{background:#FFFFFF;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:2px}
  .m.card2 .big{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--green-ink)}
  .meta{align-self:center;font-size:11px;color:var(--muted-2);margin:6px 0}
  .typing-b{align-self:flex-start;background:#F1EDED;border-radius:20px;padding:8px 14px}
  .compose{flex:none;padding:8px 10px 14px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
  .quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-height:38px}
  .quick button{border:1px solid var(--border);background:#FFFFFF;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;animation:fadeUp .3s var(--ease) both}
  .quick button.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
  .bar{display:flex;align-items:center;gap:8px}
  .bar .cam{width:36px;height:36px;border-radius:999px;background:#F1EDED;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
  .bar .field{flex:1;height:36px;border-radius:999px;border:1px solid #E5DADA;padding:0 14px;display:flex;align-items:center;font-size:14px;color:#A89C9C}
  .stage-copy .num{font-size:22px;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<div class="stage">
  <div class="stage-copy">
    <span class="eyebrow">Text it · no app</span>
    <h1 class="title" style="margin-top:10px">Text a photo of the bill to <span class="num">(844) BILL-BAK</span></h1>
    <p class="sub" style="margin-top:14px">Works on any phone, for anyone. Updates come back as texts, and you approve by replying OK.</p>
  </div>
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span>5G ▮▮▮</span></div>
    <div class="ch">
      <span class="av"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 7h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 12h6M13 16h4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <b>Remy</b><span>Text Message · SMS</span>
    </div>
    <div class="msgs" id="msgs"><div class="meta">Today 9:38 AM</div></div>
    <div class="compose">
      <div class="quick" id="quick"></div>
      <div class="bar"><span class="cam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><span class="field">Text Message</span></div>
    </div>
  </div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const msgs = $('msgs'), quick = $('quick');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const BILL = '<div class="pic"><span class="h">CALIFORNIA PACIFIC MED CTR</span><i></i><i style="width:70%"></i><i style="width:85%"></i><span class="a">$8,700.00</span></div>';
const EOB = '<div class="pic"><span class="h" style="color:#2F5B34">GOLDEN STATE HEALTH PLAN</span><i></i><i style="width:60%"></i><i style="width:80%"></i><span class="a" style="font-size:11px">Your share $1,100</span></div>';
// Each beat: what "me" sends (quick reply), then Remy's replies.
const BEATS = [
  { me: { label: 'Send photo of bill', html: BILL, photo: true },
    them: ["Got it, Rosa. <b>California Pacific Medical Center</b>, $8,700, final notice due Nov 3.", "Do you have the insurance letter (EOB)? Snap that too."] },
  { me: { label: 'Send photo of EOB', html: EOB, photo: true },
    them: ["Insurance says your share is <b>$1,100</b>, not $8,700. Checking your bank for payments…",
           "Found <b>$500</b> you paid CPMC on Sep 14. So you owe <span class=\"g\">$600</span>.",
           "Your paychecks add up to $36,400 a year, 228% of the poverty line. Sutter's write-off needs medical bills over 10% of income; yours are 3%, so no write-off. But Sutter's own billing policy says all payment plans are interest-free: <b>$100 a month for 6 months</b>, no interest. Want me to call them and set it up? Reply YES"] },
  { me: { label: 'YES', html: 'YES', primary: true },
    them: ["Asking for the interest-free plan and a pause on collections. Calling CPMC billing now. I'll text you when I'm off the phone.",
           { delay: 2600, html: '<span style="font-size:12px;color:var(--muted-2);font-weight:600">CPMC AGREED · CASE FA 20931</span><span class="big">$600</span><span>6 × $100 a month, 0% interest, collections paused</span>', card: true },
           "Reply OK to approve and I'll save the plan to your Capital One account. Nothing is paid until you do."] },
  { me: { label: 'OK', html: 'OK', primary: true },
    them: ["Approved. You owe <b>$600</b>, $100 a month starting next month, and the plan is in your Capital One account. I'll check back by Fri Oct 30 if the corrected statement hasn't arrived. Take care, Rosa."] },
];
let beat = 0, busy = false;
const scroll = () => requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
function add(cls, html) { const d = document.createElement('div'); d.className = 'm ' + cls; d.innerHTML = html; msgs.appendChild(d); scroll(); return d; }
async function them(item) {
  const html = typeof item === 'string' ? item : item.html;
  const t = document.createElement('div'); t.className = 'typing-b'; t.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  msgs.appendChild(t); scroll();
  await wait((item.delay || 0) + 700 + Math.min(html.length * 8, 1000));
  t.remove(); add('them' + (item.card ? ' card2' : ''), html);
}
function offer() {
  quick.innerHTML = '';
  const b = BEATS[beat]; if (!b) return;
  const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = b.me.label;
  if (b.me.primary) btn.className = 'primary';
  btn.onclick = send; quick.appendChild(btn);
}
async function send() {
  if (busy) return; busy = true;
  const b = BEATS[beat]; quick.innerHTML = '';
  add('me' + (b.me.photo ? ' photo' : ''), b.me.html);
  await wait(400);
  for (const t of b.them) await them(t);
  beat++; busy = false; offer();
}
offer();
</script>
</body>
</html>
