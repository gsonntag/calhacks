<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack · Approve</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="m3.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .m3-top-app-bar { flex: none; }
  .wrap { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: 8px 16px 32px; }
  #root.wait { margin: auto; text-align: center; color: var(--md-on-surface-variant); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #root.wait::before { content: "notifications"; font-family: "Material Symbols Rounded"; font-size: 40px; line-height: 1; color: var(--md-outline); }
  #root.card { margin: auto 0; padding: 24px; border-radius: var(--md-shape-xl); background: var(--md-surface-container-high); color: var(--md-on-surface);
    box-shadow: var(--md-elev-3); animation: pop var(--md-dur-l) var(--md-ease-emph); }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  #root.card .ic { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 16px; border-radius: var(--md-shape-full);
    background: var(--md-primary-container); color: var(--md-on-primary-container); }
  #root.card h1 { margin: 0 0 12px; text-align: center; }
  #root.card p { margin: 0 0 24px; color: var(--md-on-surface-variant); }
  #root.card .actions { display: flex; flex-direction: column; gap: 12px; }
  #root.card .m3-btn { width: 100%; height: 56px; font-size: 16px; }
  #root.done { margin: auto; text-align: center; padding: 24px; border-radius: var(--md-shape-xl);
    background: var(--st-success-container); color: var(--st-on-success-container); font: 500 22px/28px var(--md-font); }
</style>
</head>
<body>
<header class="m3-top-app-bar">
  <span class="m3-brand">
    <span class="m3-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span>
    <span class="m3-brand-name">BillBack</span>
  </span>
</header>
<div class="wrap">
<div id="root" class="wait" role="status" aria-live="polite">Nothing needs your OK right now.<br>Leave this open.</div>
</div>
<script>
const caseId = new URLSearchParams(location.search).get('case');
const root = document.getElementById('root');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let shown = null;
function detailText(d) {
  if (d.asks) return d.asks.join(' · ') + (d.say ? ' — ' + d.say : '');
  if (d.say) return d.say;
  if (d.monthly) return `${d.months} payments of $${d.monthly} to ${d.payee}. Interest-free. You can stop anytime.`;
  return Object.entries(d).map(([k, v]) => `${k}: ${v}`).join(' · ');
}
async function poll() {
  try {
    const list = await (await fetch(`/api/approvals?case=${caseId}`)).json();
    const a = list[0];
    if (a && a.approval_id !== shown) {
      shown = a.approval_id;
      navigator.vibrate && navigator.vibrate([120, 60, 120]);
      root.className = 'card';
      root.innerHTML = `<span class="ic" aria-hidden="true"><span class="material-symbols-rounded">approval</span></span>
        <h1 class="headline-s">${esc(a.title)}</h1><p class="body-l">${esc(detailText(a.detail))}</p>
        <div class="actions"><button class="m3-btn filled" id="y" type="button">Approve</button><button class="m3-btn outlined" id="n" type="button">Decline</button></div>`;
      document.getElementById('y').onclick = () => decide(a.approval_id, true);
      document.getElementById('n').onclick = () => decide(a.approval_id, false);
    } else if (!a && shown && root.className === 'card') {
      root.className = 'wait'; root.innerHTML = 'All set. Nothing else needs your OK.'; shown = null;
    }
  } catch (e) {}
  setTimeout(poll, 1200);
}
async function decide(id, ok) {
  let r = {};
  try { r = await (await fetch(`/api/approvals/${id}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({approved: ok})})).json(); } catch (e) {}
  root.className = 'done'; root.textContent = !r.ok ? 'This request already expired or was answered elsewhere' : (ok ? '✓ Approved' : 'Declined');
}
if (caseId) poll(); else root.textContent = 'Open this from the case page.';
</script>
</body>
</html>
