<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack · Approve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{--accent:#BE3337;--tint:#FDECEC;--ink:#1A1A1E;--muted:#6B6B73;--green:#2F5B34;--green-bg:#F3F8F3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#FFFBFB;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;padding:20px 16px}
  .logo{font-weight:800;font-size:19px;letter-spacing:-.02em}.logo span{color:var(--accent)}
  .wait{margin:auto;text-align:center;color:var(--muted);font-size:16px}
  .card{margin:auto 0;background:#fff;border:2px solid var(--accent);border-radius:24px;padding:22px;box-shadow:0 20px 40px -24px rgba(150,40,45,.45);animation:pop .35s}
  @keyframes pop{from{transform:scale(.96);opacity:0}}
  .card h1{font-size:22px;line-height:1.3;margin:0 0 10px}
  .card p{font-size:16px;line-height:1.5;margin:0 0 20px;color:#333}
  .btn{width:100%;min-height:56px;border:0;border-radius:999px;font:inherit;font-size:18px;font-weight:800;cursor:pointer;margin-top:10px}
  .yes{background:var(--accent);color:#fff}.no{background:#F2F2F4;color:var(--ink)}
  .done{margin:auto;text-align:center;font-size:20px;font-weight:700;color:var(--green);background:var(--green-bg);padding:24px;border-radius:24px}
</style>
</head>
<body>
<div class="logo">Bill<span>Back</span></div>
<div id="root" class="wait">Nothing needs your OK right now.<br>Leave this open.</div>
<script>
const caseId = new URLSearchParams(location.search).get('case');
const root = document.getElementById('root');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let shown = null;
function detailText(d) {
  if (d.asks) return d.asks.join(' · ') + (d.say ? ' — ' + d.say : '');
  if (d.say) return d.say;
  if (d.monthly) return `${d.months} payments of $${d.monthly} to ${d.payee}. Interest-free. You can stop anytime.`;
  return Object.entries(d).map(([k, v]) => `${k}: ${v}`).join(' · ');
}
async function poll() {
  try {
    const list = await (await fetch(`/api/approvals?case=${caseId}`)).json();
    const a = list[0];
    if (a && a.approval_id !== shown) {
      shown = a.approval_id;
      navigator.vibrate && navigator.vibrate([120, 60, 120]);
      root.className = 'card';
      root.innerHTML = `<h1>${esc(a.title)}</h1><p>${esc(detailText(a.detail))}</p>
        <button class="btn yes" id="y">Approve</button><button class="btn no" id="n">Decline</button>`;
      document.getElementById('y').onclick = () => decide(a.approval_id, true);
      document.getElementById('n').onclick = () => decide(a.approval_id, false);
    } else if (!a && shown && root.className === 'card') {
      root.className = 'wait'; root.innerHTML = 'All set. Nothing else needs your OK.'; shown = null;
    }
  } catch (e) {}
  setTimeout(poll, 1200);
}
async function decide(id, ok) {
  let r = {};
  try { r = await (await fetch(`/api/approvals/${id}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({approved: ok})})).json(); } catch (e) {}
  root.className = 'done'; root.textContent = !r.ok ? 'This request already expired or was answered elsewhere' : (ok ? '✓ Approved' : 'Declined');
}
if (caseId) poll(); else root.textContent = 'Open this from the case page.';
</script>
</body>
</html>
