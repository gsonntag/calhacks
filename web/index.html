<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --accent:#BE3337; --tint:#FDECEC; --ink:#1A1A1E; --muted:#4D4D55; --muted-2:#6B6B73;
    --border:#EBD5D5; --green:#2F5B34; --green-bg:#F3F8F3; --green-border:#CFE0D0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#FFFFFF;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  a{color:var(--ink)} a:hover{color:var(--accent)}
  button{font:inherit}
  button:focus-visible,a:focus-visible,.attach:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .app{position:relative;height:100vh;min-height:560px;display:flex;flex-direction:column}
  .topbar{flex:none;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .logo-word{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .logo-word span{color:var(--accent)}
  .nav a{padding:12px;font-size:15px;font-weight:500;text-decoration:none}
  main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 28px}
  .title{position:absolute;top:34vh;left:16px;right:16px;transform:translateY(-50%);margin:0 auto;max-width:760px;
    text-align:center;font-size:42px;line-height:1.15;font-weight:400;letter-spacing:-.02em}
  .title span{color:var(--accent)}
  .composer{max-width:760px;margin:0 auto;width:100%;flex:none}
  .app.empty .composer{position:absolute;top:50vh;left:16px;right:16px;width:auto;transform:translateY(-31px)}
  .app:not(.empty) .title{display:none}
  .pill{border:1px solid var(--border);border-radius:30px;background:#FFFFFF;padding:8px;display:flex;flex-direction:column;gap:6px;
    box-shadow:0 12px 32px -16px rgba(150,40,45,.22)}
  .pill:focus-within{border-color:#E9A9AB;box-shadow:0 0 0 4px rgba(190,51,55,.10),0 12px 32px -14px rgba(150,40,45,.25)}
  .pill.dragging{border-color:var(--accent)}
  .pill-row{display:flex;align-items:center;gap:6px}
  .attach{position:relative;width:44px;height:44px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
  .attach:hover{background:var(--tint)}
  .attach input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  .msg-input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:10px 4px}
  .msg-input::placeholder{color:var(--muted-2)}
  .send{width:44px;height:44px;flex:none;border:0;border-radius:999px;background:var(--accent);color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .send:disabled{background:#E8C4C5;cursor:default}
  .pending{display:flex;flex-wrap:wrap;gap:8px;padding:6px 6px 0}
  .pending:empty{display:none}
  .file-chip{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:14px;background:var(--tint);font-size:14px;font-weight:600}
  .file-chip button{width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:#5A4A4B;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .gmail-row{display:flex;justify-content:center;padding-top:14px}
  .gmail-btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid var(--border);border-radius:999px;
    background:#FFFFFF;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
  .gmail-btn img{width:20px;height:15px;object-fit:contain}
  .gmail-btn.scanning{background:var(--tint);border-color:transparent;cursor:default}
  .gmail-btn.connected{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
  .gmail-btn .dot{width:8px;height:8px;border-radius:999px;background:#3F7A45}
  .spin{animation:spin .9s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
  .thread{flex:1;min-height:0;overflow-y:auto;padding:16px 0 24px}
  .app.empty .thread{display:none}
  .thread-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .bot{display:flex;align-items:flex-start;gap:14px}
  .avatar{width:30px;height:30px;flex:none;border-radius:999px;background:var(--accent);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .bot p{margin:4px 0 0;font-size:16px;line-height:1.65}
  .user{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .user .bubble{max-width:80%;background:var(--tint);padding:12px 18px;border-radius:22px;font-size:16px;line-height:1.55}
  .user .sent-file{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #EBC3C4;border-radius:12px;font-size:14px;font-weight:600}
  .typing{display:flex;gap:5px;align-items:center;height:30px}
  .typing span{width:7px;height:7px;border-radius:999px;background:#9E2A2E;animation:dot 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .cta{margin-left:44px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:#FFFFFF;font-size:14px;font-weight:700;text-decoration:none;align-self:flex-start}
  .cta:hover{color:#FFFFFF}
  .sim{font-size:12px;color:var(--muted-2);margin-left:44px;margin-top:-14px}
  @media (max-width:600px){ .title{font-size:32px} }
</style>
</head>
<body>
<div class="app empty" id="app">
  <header class="topbar">
    <a href="/" class="logo" aria-label="BillBack home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#BE3337"/><path d="M10 7h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 12h6M13 16h4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="logo-word">Bill<span>Back</span></span>
    </a>
    <nav class="nav" aria-label="Main"><a href="dashboard.html">My cases</a><a href="case.html">Live case</a></nav>
  </header>

  <main>
    <h1 class="title">Need help reducing your <span>medical bill?</span></h1>
    <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
    <div class="composer">
      <div class="pill" id="pill">
        <div class="pending" id="pending"></div>
        <div class="pill-row">
          <label class="attach" title="Attach a bill or EOB">
            <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.webp" aria-label="Attach a bill or insurance statement">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <input class="msg-input" id="msgInput" type="text" aria-label="Message Billie" placeholder="Tell me about your bill…">
          <button class="send" id="sendBtn" type="button" aria-label="Send message" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <p class="sim" style="margin:8px 0 0;text-align:center">Demo only. Please don't upload real medical bills.</p>
      <div class="gmail-row">
        <button class="gmail-btn" id="gmailBtn" type="button"><img src="gmail-icon.svg" alt=""><span>Connect Gmail</span></button>
      </div>
    </div>
  </main>
</div>

<script>
const state = { files: [], sentFiles: [], typing: false, gmail: 'off', history: [], caseId: null };
const $ = (id) => document.getElementById(id);
const app = $('app'), thread = $('thread'), inner = $('threadInner'), input = $('msgInput'),
      sendBtn = $('sendBtn'), pending = $('pending'), pill = $('pill'), gmailBtn = $('gmailBtn');
const FILE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BE3337" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function refresh() {
  sendBtn.disabled = state.typing || !(input.value.trim() || state.files.length);
  pending.innerHTML = state.files.map((f, i) =>
    `<span class="file-chip">${FILE_SVG}${esc(f.name)}<button type="button" data-i="${i}" aria-label="Remove file">✕</button></span>`).join('');
}
function scroll() { thread.scrollTop = thread.scrollHeight; }
function addBot(text) {
  inner.insertAdjacentHTML('beforeend', `<div class="bot"><span class="avatar" aria-hidden="true">B</span><p>${esc(text)}</p></div>`);
  if (state.caseId && !inner.querySelector('.cta'))
    inner.insertAdjacentHTML('beforeend', `<a class="cta" href="case.html?id=${state.caseId}">Open my case →</a>`);
  scroll();
}
function showTyping() {
  app.classList.remove('empty');
  state.typing = true; refresh();
  const t = document.createElement('div');
  t.className = 'bot'; t.innerHTML = '<span class="avatar" aria-hidden="true">B</span><div class="typing" aria-label="Billie is typing"><span></span><span></span><span></span></div>';
  inner.appendChild(t); scroll();
  return () => { t.remove(); state.typing = false; refresh(); };
}
async function sendText(override) {
  const text = override ?? input.value.trim(), files = state.files;
  if ((!text && !files.length) || state.typing) return;
  app.classList.remove('empty');
  if (!override) inner.insertAdjacentHTML('beforeend', `<div class="user">${files.map((f) => `<span class="sent-file">${FILE_SVG}${esc(f.name)}</span>`).join('')}${text ? `<div class="bubble">${esc(text)}</div>` : ''}</div>`);
  const fd = new FormData();
  fd.append('history', JSON.stringify(state.history));
  fd.append('message', text);
  fd.append('case_id', state.caseId || '');
  // Re-send every file attached so far, so they are there on the turn the case starts.
  state.sentFiles = state.sentFiles.concat(files);
  state.sentFiles.forEach((f) => fd.append('files', f));
  state.files = []; input.value = '';
  const done = showTyping();
  try {
    const res = await fetch('/api/chat', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('chat ' + res.status);
    const r = await res.json();
    const note = files.length ? ` [attached: ${files.map((f) => f.name).join(', ')}]` : '';
    state.history.push({ role: 'user', content: (text || '(sent files)') + note });
    if (r.reply) state.history.push({ role: 'assistant', content: r.reply });
    if (r.case_id) state.caseId = r.case_id;
    done(); addBot(r.reply);
  } catch (e) { done(); addBot("Sorry, I couldn't reach the server. Try again in a moment."); }
}
function addFiles(list) { state.files = state.files.concat([...list]); refresh(); }

input.addEventListener('input', refresh);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
sendBtn.addEventListener('click', () => sendText());
$('fileInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
pending.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) { state.files.splice(+b.dataset.i, 1); refresh(); } });
pill.addEventListener('dragover', (e) => { e.preventDefault(); pill.classList.add('dragging'); });
pill.addEventListener('dragleave', () => pill.classList.remove('dragging'));
pill.addEventListener('drop', (e) => { e.preventDefault(); pill.classList.remove('dragging'); addFiles(e.dataTransfer.files); });

gmailBtn.addEventListener('click', async () => {
  if (state.gmail === 'scanning') return;
  if (state.gmail === 'on') {
    state.gmail = 'off'; gmailBtn.className = 'gmail-btn';
    gmailBtn.innerHTML = '<img src="gmail-icon.svg" alt=""><span>Connect Gmail</span>';
    return;
  }
  state.gmail = 'scanning'; gmailBtn.className = 'gmail-btn scanning';
  gmailBtn.innerHTML = '<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BE3337" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg><span>Scanning your inbox…</span>';
  const r = await (await fetch('/api/gmail/scan', { method: 'POST' })).json();
  setTimeout(() => {
    state.gmail = 'on'; gmailBtn.className = 'gmail-btn connected';
    gmailBtn.setAttribute('aria-label', 'Gmail connected. Disconnect');
    gmailBtn.innerHTML = '<img src="gmail-icon.svg" alt=""><span>Gmail connected</span><span class="dot"></span>';
    const bill = r.found.find((f) => f.type === 'bill'), eob = r.found.find((f) => f.type === 'eob');
    const msg = `I found a final notice from ${bill.from} for $${bill.amount.toLocaleString()} and an EOB from ${eob.from}. Want me to start on that bill?`;
    state.history.push({ role: 'user', content: `[Connected Gmail. Found: ${JSON.stringify(r.found)}]` }, { role: 'assistant', content: msg });
    app.classList.remove('empty'); addBot(msg);
    if (r.simulated) inner.insertAdjacentHTML('beforeend', '<div class="sim">Demo inbox (simulated Gmail)</div>');
  }, 1200);
});
refresh();
</script>
</body>
</html>
