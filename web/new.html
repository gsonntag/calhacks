<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack — New case</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="m3.css">
<style>
  html, body { height: 100%; }
  .app { height: 100vh; height: 100dvh; min-height: 520px; display: flex; flex-direction: column; }
  .m3-top-app-bar { flex: none; flex-wrap: wrap; column-gap: 24px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 20px; }
  .col { max-width: 760px; width: 100%; margin: 0 auto; }

  /* empty state: hero + composer centred */
  .hero { display: none; text-align: center; padding: 0 0 24px; }
  .app.empty main { justify-content: center; padding-bottom: 10vh; }
  .app.empty .hero { display: block; }
  .hero h1 { margin: 0; }
  .hero p { margin: 8px 0 0; }
  .starts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
  .starts .m3-chip { height: 40px; }
  .starts .m3-chip .material-symbols-rounded { color: var(--md-primary); }

  /* thread */
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 0 24px; }
  .app.empty .thread { display: none; }
  .thread-inner { display: flex; flex-direction: column; gap: 16px; }
  .bot { display: flex; align-items: flex-end; gap: 10px; }
  .bot .m3-bubble { max-width: calc(100% - 44px); }
  .avatar { width: 32px; height: 32px; flex: none; border-radius: var(--md-shape-full); display: grid; place-items: center;
    background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .avatar .material-symbols-rounded { font-size: 18px; }
  .user { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .sent-file { display: inline-flex; align-items: center; gap: 6px; max-width: 80%; padding: 6px 12px; border-radius: var(--md-shape-s);
    border: 1px solid var(--md-outline-variant); font: 500 14px/20px var(--md-font); overflow-wrap: anywhere; }
  .sent-file .material-symbols-rounded, .file-chip .material-symbols-rounded { font-size: 18px; color: var(--md-primary); }
  .typing { display: flex; gap: 5px; align-items: center; height: 44px; padding: 0 16px; border-radius: 20px; border-bottom-left-radius: 6px;
    background: var(--md-surface-container-high); }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--md-on-surface-variant); animation: dot 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .cta { margin-left: 42px; align-self: flex-start; }
  .sim { margin: 0 0 0 42px; }

  /* composer: pill input with attach + send icon buttons */
  .composer { flex: none; }
  .pill { border-radius: 28px; background: var(--md-surface-container-high); padding: 4px; display: flex; flex-direction: column; gap: 4px;
    border: 2px solid transparent; transition: border-color var(--md-dur-s) var(--md-ease); }
  .pill:focus-within { border-color: var(--md-primary); }
  .pill.dragging { border-color: var(--md-primary); border-style: dashed; background: var(--md-secondary-container); }
  .pill-row { display: flex; align-items: center; gap: 4px; }
  .attach { flex: none; width: 48px; height: 48px; }
  .attach:focus-within { outline: 3px solid var(--md-primary); outline-offset: 2px; }
  .attach input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .msg-input { flex: 1; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; padding: 0 4px;
    font: 400 16px/24px var(--md-font); letter-spacing: .5px; color: var(--md-on-surface); }
  .msg-input::placeholder { color: var(--md-on-surface-variant); }
  .send { flex: none; width: 48px; height: 48px; background: var(--md-primary); color: var(--md-on-primary); }
  .send:disabled { background: color-mix(in srgb, var(--md-on-surface) 12%, transparent); color: color-mix(in srgb, var(--md-on-surface) 38%, transparent); cursor: default; }
  .pending { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 8px 0; }
  .pending:empty { display: none; }
  .file-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 32px; padding: 0 0 0 12px; border-radius: var(--md-shape-s);
    background: var(--md-secondary-container); color: var(--md-on-secondary-container); font: 500 14px/20px var(--md-font); }
  .file-chip .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip button { width: 40px; height: 32px; border: 0; border-radius: var(--md-shape-s); background: transparent; color: inherit; cursor: pointer;
    display: grid; place-items: center; }
  .file-chip button .material-symbols-rounded { font-size: 18px; color: inherit; }
  .note { margin: 8px 0 0; text-align: center; }
  .m3-chip.scanning { cursor: default; }
  .m3-chip.connected { background: var(--st-success-container); color: var(--st-on-success-container); border-color: transparent; }
  .m3-chip .m3-spinner { width: 16px; height: 16px; border-width: 2px; margin-left: -4px; }
  @media (max-width: 600px) {
    .app.empty main { padding-bottom: 4vh; }
    .hero h1 { font-size: 30px; line-height: 38px; }
    .m3-top-app-bar { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="app empty" id="app">
  <header class="m3-top-app-bar">
    <a href="/" class="m3-brand" aria-label="BillBack home">
      <span class="m3-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span>
      <span class="m3-brand-name">BillBack</span>
    </a>
    <nav class="m3-tabs" aria-label="Main">
      <a class="m3-tab" href="/" aria-current="page">Cases</a>
      <a class="m3-tab" href="hospitals.html">Hospitals</a>
      <a class="m3-tab" href="ops.html">Under the hood</a>
    </nav>
  </header>

  <main>
    <section class="hero col" aria-labelledby="heroTitle">
      <h1 class="display-s" id="heroTitle">Your billing, handled.</h1>
      <p class="body-l muted">Share your hospital bill. Billie finds the errors and gets it lowered.</p>
      <div class="starts" role="group" aria-label="Quick start">
        <button class="m3-chip" id="sampleChip" type="button"><span class="material-symbols-rounded" aria-hidden="true">description</span>Use a sample bill</button>
        <button class="m3-chip" id="uploadChip" type="button"><span class="material-symbols-rounded" aria-hidden="true">upload_file</span>Upload bill + insurance</button>
        <button class="m3-chip" id="gmailBtn" type="button"><span class="material-symbols-rounded" aria-hidden="true">mail</span><span>Demo inbox</span></button>
      </div>
    </section>

    <div class="thread col" id="thread"><div class="thread-inner" id="threadInner"></div></div>

    <div class="composer col">
      <div class="pill" id="pill">
        <div class="pending" id="pending"></div>
        <div class="pill-row">
          <label class="m3-icon-btn attach" title="Attach a bill or insurance statement">
            <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.webp" aria-label="Attach a bill or insurance statement">
            <span class="material-symbols-rounded" aria-hidden="true">attach_file</span>
          </label>
          <input class="msg-input" id="msgInput" type="text" aria-label="Message Billie" placeholder="Tell me about your bill…">
          <button class="m3-icon-btn send" id="sendBtn" type="button" aria-label="Send message" disabled>
            <span class="material-symbols-rounded" aria-hidden="true">arrow_upward</span>
          </button>
        </div>
      </div>
      <p class="note body-s muted">Demo only. Please don't upload real medical bills.</p>
    </div>
  </main>
</div>

<script>
const state = { files: [], sentFiles: [], typing: false, gmail: 'off', history: [], caseId: null };
const $ = (id) => document.getElementById(id);
const app = $('app'), thread = $('thread'), inner = $('threadInner'), input = $('msgInput'),
      sendBtn = $('sendBtn'), pending = $('pending'), pill = $('pill'), gmailBtn = $('gmailBtn');
const FILE_ICON = '<span class="material-symbols-rounded" aria-hidden="true">description</span>';
const AVATAR = '<span class="avatar" aria-hidden="true"><span class="material-symbols-rounded">ecg_heart</span></span>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function refresh() {
  sendBtn.disabled = state.typing || !(input.value.trim() || state.files.length);
  pending.innerHTML = state.files.map((f, i) =>
    `<span class="file-chip">${FILE_ICON}<span class="fn">${esc(f.name)}</span><button type="button" data-i="${i}" aria-label="Remove file"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></span>`).join('');
}
function scroll() { thread.scrollTop = thread.scrollHeight; }
function addBot(text) {
  inner.insertAdjacentHTML('beforeend', `<div class="bot">${AVATAR}<div class="m3-bubble them">${esc(text)}</div></div>`);
  if (state.caseId && !inner.querySelector('.cta'))
    inner.insertAdjacentHTML('beforeend', `<a class="cta m3-btn filled" href="case.html?id=${state.caseId}">Open my case<span class="material-symbols-rounded" aria-hidden="true" style="margin:0 -8px 0 0">arrow_forward</span></a>`);
  scroll();
}
function showTyping() {
  app.classList.remove('empty');
  state.typing = true; refresh();
  const t = document.createElement('div');
  t.className = 'bot'; t.innerHTML = AVATAR + '<div class="typing" role="status" aria-label="Billie is typing"><span></span><span></span><span></span></div>';
  inner.appendChild(t); scroll();
  return () => { t.remove(); state.typing = false; refresh(); };
}
async function sendText(override) {
  const text = override ?? input.value.trim(), files = state.files;
  if ((!text && !files.length) || state.typing) return;
  app.classList.remove('empty');
  if (!override) inner.insertAdjacentHTML('beforeend', `<div class="user">${files.map((f) => `<span class="sent-file">${FILE_ICON}${esc(f.name)}</span>`).join('')}${text ? `<div class="m3-bubble me">${esc(text)}</div>` : ''}</div>`);
  const fd = new FormData();
  fd.append('history', JSON.stringify(state.history));
  fd.append('message', text);
  fd.append('case_id', state.caseId || '');
  // Re-send every file attached so far, so they are there on the turn the case starts.
  state.sentFiles = state.sentFiles.concat(files);
  state.sentFiles.forEach((f) => fd.append('files', f));
  state.files = []; input.value = '';
  const done = showTyping();
  try {
    const res = await fetch('/api/chat', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('chat ' + res.status);
    const r = await res.json();
    const note = files.length ? ` [attached: ${files.map((f) => f.name).join(', ')}]` : '';
    state.history.push({ role: 'user', content: (text || '(sent files)') + note });
    if (r.reply) state.history.push({ role: 'assistant', content: r.reply });
    if (r.case_id) state.caseId = r.case_id;
    if (r.started) { location.href = `case.html?id=${r.case_id}`; return; }  // watch the review from its first step
    done(); addBot(r.reply);
  } catch (e) { done(); addBot("Sorry, I couldn't reach the server. Try again in a moment."); }
}
function addFiles(list) { state.files = state.files.concat([...list]); refresh(); }

input.addEventListener('input', refresh);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
sendBtn.addEventListener('click', () => sendText());
$('fileInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; input.focus(); });
pending.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) { state.files.splice(+b.dataset.i, 1); refresh(); } });
pill.addEventListener('dragover', (e) => { e.preventDefault(); pill.classList.add('dragging'); });
pill.addEventListener('dragleave', () => pill.classList.remove('dragging'));
pill.addEventListener('drop', (e) => { e.preventDefault(); pill.classList.remove('dragging'); addFiles(e.dataTransfer.files); });

// Quick starts: the sample chip just says it in the chat; the upload chip opens the file picker.
$('sampleChip').addEventListener('click', () => { input.value = 'Use the sample bill'; sendText(); });
$('uploadChip').addEventListener('click', () => $('fileInput').click());

const GMAIL_OFF = '<span class="material-symbols-rounded" aria-hidden="true">mail</span><span>Demo inbox</span>';
gmailBtn.addEventListener('click', async () => {
  if (state.gmail === 'scanning') return;
  if (state.gmail === 'on') {
    state.gmail = 'off'; gmailBtn.className = 'm3-chip'; gmailBtn.removeAttribute('aria-label');
    gmailBtn.innerHTML = GMAIL_OFF;
    return;
  }
  state.gmail = 'scanning'; gmailBtn.className = 'm3-chip scanning';
  gmailBtn.innerHTML = '<span class="m3-spinner" aria-hidden="true"></span><span>Loading demo inbox…</span>';
  let r;
  try { r = await (await fetch('/api/gmail/scan', { method: 'POST' })).json(); }
  catch (e) { state.gmail = 'off'; gmailBtn.className = 'm3-chip'; gmailBtn.innerHTML = GMAIL_OFF; return; }
  {
    state.gmail = 'on'; gmailBtn.className = 'm3-chip connected';
    gmailBtn.setAttribute('aria-label', 'Demo inbox loaded. Remove');
    gmailBtn.innerHTML = '<span class="material-symbols-rounded" aria-hidden="true">check</span><span>Demo inbox</span>';
    const bill = r.found.find((f) => f.type === 'bill'), eob = r.found.find((f) => f.type === 'eob');
    const msg = `I found a final notice from ${bill.from} for $${bill.amount.toLocaleString()} and an insurance statement from ${eob.from}. Want me to start on that bill?`;
    state.history.push({ role: 'user', content: `[Connected Gmail. Found: ${JSON.stringify(r.found)}]` }, { role: 'assistant', content: msg });
    app.classList.remove('empty'); addBot(msg);
    if (r.simulated) inner.insertAdjacentHTML('beforeend', '<div class="sim body-s muted">Demo inbox (simulated Gmail)</div>');
  }
});
refresh();
</script>
</body>
</html>
