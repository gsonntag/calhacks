<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack — Households</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="m3.css">
<!--
  Every household BillBack has helped, lowest income vs the poverty line first. Stored in Tiger Data
  (billback/tiger.py): profiles + a transactions hypertable + the monthly_cashflow continuous aggregate.
  Data: GET /api/households (admin key).
-->
<style>
  .m3-top-app-bar { flex-wrap: wrap; column-gap: 24px; }
  @media (max-width: 720px) { .m3-top-app-bar .m3-tabs { order: 2; flex-basis: 100%; margin: 0 -16px; padding: 0 8px; gap: 0; } .m3-top-app-bar .m3-tab { padding: 0 10px; } }
  .hero h1 { margin: 8px 0 4px; }
  .hero p { margin: 0; max-width: 760px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .stats .m3-card { padding: 16px 20px; }
  .stats .stat-value { font-size: 32px; line-height: 40px; }
  @media (max-width: 640px) { .stats { grid-template-columns: 1fr 1fr; } .stats .m3-card:last-child { grid-column: 1 / -1; } }
  .rows { padding: 0; overflow: hidden; }
  .hh { display: grid; grid-template-columns: minmax(0, 1fr) 150px max-content; align-items: center; gap: 16px;
        padding: 14px 20px; border-bottom: 1px solid var(--md-outline-variant); }
  .hh:last-child { border-bottom: 0; }
  .hh .name { font: 500 16px/24px var(--md-font); overflow-wrap: anywhere; }
  .hh .sub { font: 400 13px/20px var(--md-font); color: var(--md-on-surface-variant); overflow-wrap: anywhere; }
  .hh .fpl { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
  .hh .fpl b { font: 700 22px/28px var(--md-font); font-variant-numeric: tabular-nums; }
  .hh .fpl span { font: 400 12px/16px var(--md-font); color: var(--md-on-surface-variant); white-space: nowrap; }
  .band-free b { color: var(--st-money); } .band-disc b { color: var(--st-info); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
  .bars i { flex: 1; min-width: 4px; background: var(--md-primary); border-radius: 2px 2px 0 0; opacity: .8; }
  .bars-cap { font: 400 11px/14px var(--md-font); color: var(--md-on-surface-variant); margin-top: 2px; }
  @media (max-width: 560px) { .hh { grid-template-columns: minmax(0, 1fr) max-content; } .hh .spark { grid-column: 1 / -1; order: 3; } }
  .empty, #err { padding: 16px 20px; }
</style>
</head>
<body>
<header class="m3-top-app-bar">
  <a href="/" class="m3-brand" aria-label="BillBack home"><span class="m3-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span><span class="m3-brand-name">BillBack</span></a>
  <nav class="m3-tabs" aria-label="Main"><a class="m3-tab" href="/">Cases</a><a class="m3-tab" href="hospitals.html">Hospitals</a><a class="m3-tab" href="households.html" aria-current="page">Households</a><a class="m3-tab" href="ops.html">Under the hood</a></nav>
</header>
<main class="m3-page m3-stack">
  <div class="hero">
    <h1 class="headline-l">Households by need</h1>
    <p class="body-l muted">Everyone we've helped, lowest income relative to the poverty line first. Income history is
      every bank deposit we pulled, rolled up by month in Tiger Data.</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="m3-card error" id="err" role="alert" hidden></div>
  <div class="m3-card rows" id="list"></div>
</main>
<script src="/auth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const money = (n) => '$' + Math.round(n || 0).toLocaleString();
const band = (h) => h.discount_pct >= 100 ? ['band-free', 'free care'] : h.discount_pct > 0 ? ['band-disc', `${h.discount_pct}% off`] : ['', 'no discount'];

function spark(months) {
  if (!months.length) return '<div class="bars-cap">no history</div>';
  const max = Math.max(...months.map((m) => m.income), 1);
  const bars = months.map((m) => `<i style="height:${Math.max(4, 100 * m.income / max)}%" title="${esc(m.month.slice(0, 7))}: ${money(m.income)}"></i>`).join('');
  return `<div class="bars" aria-label="Monthly income">${bars}</div><div class="bars-cap">${months.length} mo · ${money(months.reduce((a, m) => a + m.income, 0))}</div>`;
}

async function load() {
  const r = await fetch('/api/households');
  if (!r.ok) { $('err').hidden = false; $('err').textContent = r.status === 401 ? 'Needs the admin key.' : `Couldn't load households (${r.status}).`; return; }
  const { enabled, households: hs } = await r.json();
  if (!enabled) { $('list').innerHTML = '<div class="empty muted">Tiger Data isn\'t connected (set TIGER_DATABASE_URL).</div>'; return; }
  const free = hs.filter((h) => h.discount_pct >= 100).length;
  $('stats').innerHTML = [['Households', hs.length], ['Qualify for free care', free],
    ['Months of income on file', hs.reduce((a, h) => a + h.months_on_file, 0)]]
    .map(([k, v]) => `<div class="m3-card"><div class="label-l muted">${k}</div><div class="stat-value">${v}</div></div>`).join('');
  $('list').innerHTML = hs.length ? hs.map((h) => {
    const [cls, what] = band(h);
    const who = [h.household_size && `household of ${h.household_size}`, h.insured ? 'insured' : 'uninsured', h.city].filter(Boolean).join(' · ');
    const link = h.last_case_id ? `<a href="case.html?id=${encodeURIComponent(h.last_case_id)}">latest case</a>` : '';
    return `<div class="hh"><div><div class="name">${esc(h.first_name)} ${esc(h.last_name)}</div>
      <div class="sub">${esc(who)}</div><div class="sub">${esc(h.hospital)} · ${money(h.income_annual)}/yr take-home ${link ? '· ' + link : ''}</div></div>
      <div class="spark">${spark(h.months)}</div>
      <div class="fpl ${cls}"><b>${h.fpl_pct == null ? '—' : Math.round(h.fpl_pct) + '%'}</b><span>of poverty line · ${what}</span></div></div>`;
  }).join('') : '<div class="empty muted">No households yet. They appear here once a case reaches the income step.</div>';
}
load();
addEventListener('scroll', () => document.querySelector('.m3-top-app-bar').classList.toggle('scrolled', scrollY > 4), { passive: true });
</script>
</body>
</html>
