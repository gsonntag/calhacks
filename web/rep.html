<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing rep console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="m3.css">
<style>
  /* Desk-mode call: a teammate plays the hospital billing rep in the browser.
     Backup for when the Cartesia phone call isn't available. Hold the mic button to talk (Chrome),
     or type. BillBack's replies play through Cartesia TTS (or the browser voice if no key). */
  body { min-height: 100vh; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .m3-top-app-bar { flex: none; gap: 12px; border-bottom: 1px solid var(--md-outline-variant); }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .who .title-m { overflow-wrap: anywhere; }
  #hang { flex: none; color: var(--md-error); border-color: var(--md-error); padding: 0 16px; }
  #hang .material-symbols-rounded { margin-left: -4px; }
  #log { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #log .m3-bubble { max-width: 85%; }
  #log .m3-bubble.me { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  #answer { margin: auto; height: 64px; padding: 0 36px; font-size: 18px; }
  #answer .material-symbols-rounded { font-size: 24px; }
  footer { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--md-surface-container); }
  #txt { flex: 1; min-width: 0; min-height: 48px; }
  #mic, #send { width: 48px; height: 48px; flex: none; }
  #mic { touch-action: none; }
  #mic.on { background: var(--md-error); color: var(--md-on-error); }
  #send { background: var(--md-primary); color: var(--md-on-primary); }
</style>
</head>
<body>
<header class="m3-top-app-bar">
  <span class="m3-brand-mark" aria-hidden="true"><span class="material-symbols-rounded">ecg_heart</span></span>
  <div class="who">
    <h1 class="title-m" id="hosp" style="margin:0">Hospital billing</h1>
    <small class="body-s muted">Patient Financial Services · <span id="sub">Incoming call</span></small>
  </div>
  <button class="m3-btn outlined" id="hang" type="button"><span class="material-symbols-rounded" aria-hidden="true">call_end</span>Hang up</button>
</header>
<main id="log" aria-live="polite"><button class="m3-btn filled" id="answer" type="button"><span class="material-symbols-rounded" aria-hidden="true">call</span>Answer</button></main>
<footer>
  <button class="m3-icon-btn tonal" id="mic" type="button" title="Hold to talk" aria-label="Hold to talk"><span class="material-symbols-rounded" aria-hidden="true">mic</span></button>
  <input class="m3-input pill" id="txt" aria-label="Say something as the billing rep" placeholder="Say something as the rep… e.g. case number FA-2291">
  <button class="m3-icon-btn" id="send" type="button" aria-label="Send"><span class="material-symbols-rounded" aria-hidden="true">send</span></button>
</footer>
<script src="/auth.js"></script>
<script>
const callId = new URLSearchParams(location.search).get('call');
const hospName = new URLSearchParams(location.search).get('hospital');
if (hospName) document.getElementById('hosp').textContent = hospName;
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let busy = false, ended = false;
function add(cls, text) { $('log').insertAdjacentHTML('beforeend', `<div class="m3-bubble ${cls === "me" ? "me" : "them"}">${esc(text)}</div>`); $('log').scrollTop = 1e9; return $('log').lastElementChild; }
let audio = null;
async function speakOnce(text) {
  try {
    const r = await fetch('/api/tts', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text, call_id: callId})});
    if (r.ok) { audio = new Audio(URL.createObjectURL(await r.blob())); await audio.play(); await new Promise((res) => { audio.onended = res; audio.onerror = res; }); return; }
  } catch (e) {}
  await new Promise((res) => { const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; u.onend = res; u.onerror = res; speechSynthesis.speak(u); });
}
// Chrome sometimes never fires onend; never let a stuck voice lock the console.
function speak(text) {
  const limit = 8000 + text.length * 90;
  return Promise.race([speakOnce(text), new Promise((res) => setTimeout(() => {
    try { speechSynthesis.cancel(); if (audio) audio.pause(); } catch (e) {}
    res();
  }, limit))]);
}
// Streamed replies (POST .../turn/stream, NDJSON): text sentences as Claude writes them and Sonic audio
// (pcm_s16le 24 kHz) as it's generated, scheduled back to back with Web Audio. Speech starts after the
// first sentence instead of after the whole reply plus a whole WAV. Falls back to turn + /api/tts.
let actx = null, nextAt = 0, sources = [], carry = null;
function audioCtx() {  // created/resumed inside a click or mic press (autoplay rules)
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
function playPcm(b64) {
  const ctx = audioCtx(); if (!ctx) return false;
  let bin = atob(b64);
  if (carry !== null) { bin = carry + bin; carry = null; }
  if (bin.length % 2) { carry = bin.slice(-1); bin = bin.slice(0, -1); }
  const n = bin.length >> 1; if (!n) return true;
  const buf = ctx.createBuffer(1, n, 24000), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; ch[i] = v / 32768; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  nextAt = Math.max(nextAt, ctx.currentTime + 0.02); src.start(nextAt); nextAt += buf.duration;
  sources.push(src); src.onended = () => { sources = sources.filter((x) => x !== src); };
  return true;
}
function stopAudio() { for (const s of sources) { try { s.stop(); } catch (e) {} } sources = []; nextAt = 0; carry = null; }
function playbackDone() {
  return new Promise((res) => { const tick = () => { if (ended || !actx || actx.currentTime >= nextAt) res(); else setTimeout(tick, Math.max(30, (nextAt - actx.currentTime) * 1000)); }; tick(); });
}
// null = the server has no streaming endpoint (use the old path); throws if the stream breaks mid-turn.
async function turnStream(repSaid) {
  const res = await fetch(`/api/calls/${callId}/turn/stream`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({rep_said: repSaid})});
  if (!res.ok || !res.body) return null;
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', bubble = null, played = false, final = null;
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (ev.type === 'text') { if (!bubble) bubble = add('bb', ''); bubble.textContent += ev.text; $('log').scrollTop = 1e9; }
      else if (ev.type === 'audio' && !ended) { played = playPcm(ev.data) || played; }
      else if (ev.type === 'done') final = ev;
    }
  }
  if (!final) throw new Error('stream cut');
  if (final.say) { if (!bubble) bubble = add('bb', ''); bubble.textContent = final.say; }
  if (played) await playbackDone(); else if (final.say && !ended) await speak(final.say);
  return final;
}
async function turn(repSaid) {
  if (busy || ended) return; busy = true;
  audioCtx();
  try {
    if (repSaid) add('me', repSaid);
    const streamed = await turnStream(repSaid);
    if (streamed) { if (streamed.ended) { ended = true; $('sub').textContent = 'Call ended'; } return; }
    const res = await fetch(`/api/calls/${callId}/turn`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({rep_said: repSaid})});
    if (!res.ok) throw new Error('turn ' + res.status);
    const r = await res.json();
    if (r.say) { add('bb', r.say); await speak(r.say); }
    if (r.ended) { ended = true; $('sub').textContent = 'Call ended'; }
  } catch (e) {
    add('bb', '(connection hiccup, try again)');
  } finally { busy = false; }
}
$('hang').onclick = async () => {
  ended = true; $('sub').textContent = 'Call ended'; stopAudio();
  try { await fetch(`/api/calls/${callId}/hangup`, {method: 'POST'}); } catch (e) {}
};
$('answer').onclick = () => { $('answer').remove(); $('sub').textContent = 'On call with BillBack (automated assistant)'; turn('Patient Financial Services, this is Diane, how can I help you?'); };
$('send').onclick = () => { const t = $('txt').value.trim(); if (t) { $('txt').value = ''; turn(t); } };
$('txt').onkeydown = (e) => { if (e.key === 'Enter') $('send').click(); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; let heard = '';
  rec.onresult = (e) => { heard = [...e.results].map((r) => r[0].transcript).join(' '); };
  rec.onend = () => { $('mic').classList.remove('on'); if (heard.trim()) turn(heard.trim()); heard = ''; };
  const start = (e) => { e.preventDefault(); if (!busy && !ended) { $('mic').classList.add('on'); rec.start(); } };
  $('mic').addEventListener('pointerdown', start);
  $('mic').addEventListener('pointerup', () => rec.stop());
} else { $('mic').style.display = 'none'; }
</script>
</body>
</html>
