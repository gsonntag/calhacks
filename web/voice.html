<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remy voices</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="m3.css">
<style>
  /* Voice + pronunciation demo: pick the caller's voice (accent) and hear a billing line before/after
     Remy's pronunciation normalizer (remy/voice/pronounce.py). Uses /api/voices* from remy.voice. */
  .m3-top-app-bar { flex-wrap: wrap; column-gap: 24px; }
  .head h1 { margin: 0; }
  .head p { margin: 4px 0 0; }
  .m3-card h2 { margin: 0 0 12px; }
  .voices { display: flex; flex-wrap: wrap; gap: 8px; }
  .v { height: auto; min-height: 40px; padding: 6px 16px; gap: 6px; white-space: normal; text-align: left; }
  .v .acc { font-weight: 400; color: var(--md-on-surface-variant); }
  .v.on { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }
  .v.on .acc { color: inherit; }
  .v .material-symbols-rounded { display: none; }
  .v.on .material-symbols-rounded { display: inline-block; }
  #voiceDesc { margin: 12px 0 0; min-height: 20px; }
  .m3-textarea { min-height: 120px; resize: vertical; }
  .play { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .play .material-symbols-rounded { font-size: 20px; }
  #msg { min-height: 20px; margin: 8px 0 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--md-surface-container); color: var(--md-on-surface);
    border-radius: var(--md-shape-m); padding: 12px 16px; margin: 8px 0 0; font: 400 14px/20px ui-monospace, Menlo, monospace; }
  .out { margin-top: 20px; }
  @media (max-width: 600px) { .m3-card { padding: 16px; } .play .m3-btn { flex: 1 1 100%; } }
  @media (pointer: coarse), (max-width: 640px) { .v.m3-chip { min-height: 44px; } }
</style>
</head>
<body>
<header class="m3-top-app-bar">
  <a href="/" class="m3-brand" aria-label="Remy home">
    <span class="m3-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span>
    <span class="m3-brand-name">Remy</span>
  </a>
  <nav class="m3-tabs" aria-label="Main">
    <a class="m3-tab" href="/">Cases</a>
    <a class="m3-tab" href="hospitals.html">Hospitals</a>
    <a class="m3-tab" href="ops.html">Under the hood</a>
  </nav>
</header>
<main class="m3-page narrow m3-stack">
  <div class="head">
    <h1 class="headline-m">Caller voice</h1>
    <p class="body-l muted">Cartesia Sonic voices, and how Remy makes them say billing details correctly.</p>
  </div>
  <section class="m3-card">
    <h2 class="title-m">Voice</h2>
    <div class="voices" id="voices" role="group" aria-label="Voice"></div>
    <p class="body-m muted" id="voiceDesc"></p>
  </section>
  <section class="m3-card">
    <h2 class="title-m"><label for="text">Line</label></h2>
    <textarea class="m3-textarea" id="text">Your statement shows $8,700 for the 2026-08-02 visit, but Golden State's EOB for claim C-2026-0815-44917 lists $1,100. That includes CPT 80053, a comprehensive metabolic panel, and HCPCS J2405, ondansetron. Account BCH-48213977.</textarea>
    <div class="play">
      <button class="m3-btn filled" id="after" type="button"><span class="material-symbols-rounded icon-fill" aria-hidden="true">play_arrow</span>After (Remy pronunciation)</button>
      <button class="m3-btn outlined" id="before" type="button"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Before (raw text)</button>
    </div>
    <p class="body-m muted" id="msg" role="status"></p>
    <div class="out">
      <div class="overline">What Sonic receives after normalization</div>
      <pre id="spoken"></pre>
    </div>
  </section>
</main>
<script src="/auth.js"></script>
<script>
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let voice = null, audio = null;
async function loadVoices() {
  const r = await (await fetch('/api/voices')).json();
  voice = r.default;
  $('voices').innerHTML = r.voices.map((v) =>
    `<button class="v m3-chip${v.id === voice ? ' on' : ''}" type="button" aria-pressed="${v.id === voice}" data-id="${esc(v.id)}" data-desc="${esc(v.description || '')}"><span class="material-symbols-rounded" aria-hidden="true">check</span><b>${esc(v.name)}</b><span class="acc">${esc(v.accent)} · ${esc(v.gender)}</span></button>`).join('');
  const describe = () => { const on = $('voices').querySelector('.v.on'); $('voiceDesc').textContent = on ? on.dataset.desc : ''; };
  $('voices').querySelectorAll('.v').forEach((b) => b.onclick = () => {
    voice = b.dataset.id;
    $('voices').querySelectorAll('.v').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
    describe();
    showSpoken();
  });
  describe();
  showSpoken();
}
async function showSpoken() {
  const r = await (await fetch('/api/voices/normalize', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: $('text').value, voice_id: voice})})).json();
  $('spoken').textContent = r.spoken;
}
async function play(pronounce) {
  $('msg').textContent = 'Generating…';
  try {
    const r = await fetch('/api/voices/sample', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: $('text').value, voice_id: voice, pronounce})});
    if (r.status === 404) {  // no Cartesia (offline demo): the browser's own voice reads the same normalized text
      const said = pronounce ? $('spoken').textContent : $('text').value;
      speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(said));
      $('msg').textContent = 'Your browser’s voice (no Cartesia key, or offline): Sonic sounds different';
      return;
    }
    if (!r.ok) throw new Error('TTS failed (' + r.status + ')');
    if (audio) audio.pause();
    audio = new Audio(URL.createObjectURL(await r.blob()));
    await audio.play();
    $('msg').textContent = pronounce ? 'With Remy pronunciation' : 'Raw text (Cartesia’s default normalizer only)';
  } catch (e) { $('msg').textContent = e.message; }
}
$('before').onclick = () => play(false);
$('after').onclick = () => play(true);
let t = null;
$('text').oninput = () => { clearTimeout(t); t = setTimeout(showSpoken, 250); };
loadVoices();
</script>
</body>
</html>
