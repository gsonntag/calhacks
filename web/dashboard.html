<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBack — Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="m3.css">
<!--
  Cases (home, served at /): every saved case (data/cases/), its balance, calls, the follow-up BillBack scheduled and
  when it's due. Polls /api/dashboard. Per-case actions: Ask BillBack (/ask), Call again (/call-again, which
  waits on the patient's approval on the case page), and a demo clock (/clock) to make a follow-up come due.
  "+ New case" opens the chat intake (new.html); with no cases yet the page goes straight there.
-->
<style>
  /* shared top app bar layout (wraps the tabs under the brand on phones) */
  .m3-top-app-bar { flex-wrap: wrap; column-gap: 24px; }
  @media (max-width: 720px) { .m3-top-app-bar .m3-tabs { order: 2; flex-basis: 100%; margin: 0 -16px; padding: 0 8px; gap: 0; } .m3-top-app-bar .m3-tab { padding: 0 10px; } }

  .hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; }
  .hero > div { flex: 1 1 320px; min-width: 0; }
  .hero h1 { margin: 8px 0 4px; }
  .hero p { margin: 0; }
  .section-title { margin: 16px 0 0; }

  #cases { display: flex; flex-direction: column; gap: 12px; }
  .case { padding: 0; overflow: hidden; }
  .case.overdue { border-color: var(--st-warn); }
  .case-head {
    width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; text-align: left;
    background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 0;
  }
  .case-head { padding: 14px 20px; gap: 0; }
  .ch-top { align-items: center; }
  .ch-saved { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
  .ch-saved b { font: 700 22px/28px var(--md-font); color: var(--st-money); letter-spacing: -.2px; }
  .ch-saved span { font: 400 12px/16px var(--md-font); color: var(--md-on-surface-variant); }
  .ch-saved.zero span { font-size: 14px; line-height: 20px; }
  .ch-who .m3-status { vertical-align: middle; }
  .sum { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
  .ch-meta { display: flex; align-items: center; gap: 8px; font: 400 14px/20px var(--md-font); }
  .case-head:focus-visible { outline-offset: -3px; border-radius: var(--md-shape-l); }
  .ch-top { display: flex; align-items: flex-start; gap: 12px; }
  .ch-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ch-who b { font: 500 18px/24px var(--md-font); letter-spacing: 0; overflow-wrap: anywhere; }
  .ch-who span { font: 400 14px/20px var(--md-font); color: var(--md-on-surface-variant); }
  .ch-right { flex: none; display: flex; align-items: center; gap: 4px; }
  .chev { color: var(--md-on-surface-variant); transition: transform var(--md-dur-m) var(--md-ease); }
  .case-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .ch-money { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-variant-numeric: tabular-nums; }
  .ch-money .from { font: 400 16px/24px var(--md-font); color: var(--md-on-surface-variant); }
  .ch-money .arrow { font-size: 18px; color: var(--md-on-surface-variant); align-self: center; }
  .ch-money .now { font: 700 28px/36px var(--md-font); letter-spacing: -.3px; }
  .ch-money .now.down { color: var(--st-money); }
  .ch-money .back { font: 500 14px/20px var(--md-font); color: var(--st-money); }
  .ch-next { display: flex; align-items: flex-start; gap: 8px; }
  .ch-next .nx { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .ch-next .material-symbols-rounded { margin-top: 1px; }
  .ch-next { font: 400 14px/20px var(--md-font); color: var(--md-on-surface-variant); }
  .ch-next .material-symbols-rounded { font-size: 18px; }
  .ch-next .act { color: var(--md-on-surface); font-weight: 500; }

  .case-body { padding: 4px 20px 20px; border-top: 1px solid var(--md-outline-variant); display: flex; flex-direction: column; gap: 20px; }
  .tl { display: flex; flex-direction: column; gap: 16px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 16px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font: 400 14px/20px var(--md-font); }
  .facts dt { color: var(--md-on-surface-variant); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .sub-h { margin: 0 0 2px; }
  .case-body .m3-list-item { min-height: 48px; padding: 10px 0; }
  .case-body .li-leading .material-symbols-rounded { font-size: 20px; }
  .none { margin: 4px 0 0; font: 400 14px/20px var(--md-font); color: var(--md-on-surface-variant); }

  .ask { display: flex; flex-direction: column; gap: 10px; }
  .ask-row { display: flex; gap: 8px; align-items: center; }
  .ask-row .m3-input { min-height: 48px; flex: 1; min-width: 0; }
  .ask-row .m3-input.pill:focus { border: 2px solid var(--md-primary); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips .m3-chip { height: 40px; }
  .answer { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: var(--md-shape-l); background: var(--md-surface-container-low); }
  .answer:empty { display: none; }
  .answer .avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .answer .avatar .material-symbols-rounded { font-size: 20px; }
  .answer p { margin: 4px 0 0; font: 400 15px/22px var(--md-font); letter-spacing: .25px; min-width: 0; overflow-wrap: anywhere; }
  .answer small { display: block; margin-top: 4px; font: 400 12px/16px var(--md-font); color: var(--md-on-surface-variant); }

  .clock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-radius: var(--md-shape-m); border: 1px dashed var(--md-outline-variant); font: 400 14px/20px var(--md-font); color: var(--md-on-surface-variant); }
  .clock b { color: var(--md-on-surface); font-weight: 500; }
  .clock .lbl { flex-basis: 100%; }
  .clock .lbl .material-symbols-rounded { font-size: 18px; vertical-align: -4px; margin-right: 6px; }
  @media (min-width: 720px) { .clock .lbl { flex-basis: auto; margin-right: 4px; } }
  .clock .m3-chip { height: 40px; }

  @media (max-width: 560px) {
    .case-head { padding: 16px; } .case-body { padding: 4px 16px 16px; }
    .facts { grid-template-columns: 1fr; gap: 0; } .facts dt { margin-top: 6px; }
    .ask-row .m3-btn { padding: 0 16px; }
  }
</style>
</head>
<body>
<header class="m3-top-app-bar">
  <a href="/" class="m3-brand" aria-label="BillBack home"><span class="m3-brand-mark"><span class="material-symbols-rounded" aria-hidden="true">ecg_heart</span></span><span class="m3-brand-name">BillBack</span></a>
  <nav class="m3-tabs" aria-label="Main"><a class="m3-tab" href="/" aria-current="page">Cases</a><a class="m3-tab" href="hospitals.html">Hospitals</a><a class="m3-tab" href="ops.html">Under the hood</a></nav>
</header>

<main class="m3-page m3-stack">
  <div class="hero">
    <div>
      <h1 class="headline-l">Your billing, handled.</h1>
      <p class="body-l muted">Every bill BillBack is working on, what billing promised, and when it checks back.</p>
    </div>
    <a class="m3-btn filled" href="new.html"><span class="material-symbols-rounded" aria-hidden="true">add</span>New case</a>
  </div>
  <h2 class="title-l section-title" id="casesTitle" hidden>All cases <span class="body-m muted">· most saved first</span></h2>
  <div id="cases" aria-live="polite"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => '$' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const day = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); };
const setHTML = (el, html) => { if (el._html !== html) { el.innerHTML = html; el._html = html; } };
const icon = (name, cls = '') => `<span class="material-symbols-rounded ${cls}" aria-hidden="true">${name}</span>`;
const STATUS = {
  created: ['Starting', 'info live'], reviewing: ['Reviewing', 'info live'], awaiting_call_approval: ['Needs your OK', 'warn'],
  calling: ['On a call', 'info live'], planning: ['Planning', 'info live'], done: ['Resolved', 'success'],
  interrupted: ['Interrupted', ''], error: ['Error', 'error'],
};
const cards = {};

function statusChip(c) {
  if (c.next && c.next.overdue) return `<span class="m3-status warn">${icon('schedule')}Follow-up overdue</span>`;
  const [label, cls] = STATUS[c.status] || [c.status, ''];
  return `<span class="m3-status ${cls}">${esc(label)}</span>`;
}

function when(n) {
  if (!n.due) return '';
  if (n.overdue) return `<span>Was due ${day(n.due)}</span><span class="m3-status warn">Overdue</span>`;
  if (n.due_today) return `<span>Due today, ${day(n.due)}</span><span class="m3-status info">Today</span>`;
  if (n.days_left != null) return `<span>By ${day(n.due)} · in ${n.days_left} day${n.days_left === 1 ? '' : 's'}</span>`;
  return `<span>${day(n.due)}</span>`;
}

/* needs the patient: a call or payment plan waiting for approval, or a follow-up past due; returns the quiet chip */
function needsYou(c) {
  if (c.status === 'awaiting_call_approval') return ['Approve the call', 'warn'];
  if (c.needs_plan_ok) return ['Approve the plan', 'warn'];
  if (c.next && c.next.overdue) return ['Overdue', 'warn'];
  return null;
}

const savedOf = (c) => Math.max(0, (c.original || 0) - (c.current_balance || 0)) + (c.refund || 0);

/* collapsed row: hospital and patient on the left, money saved on the right; everything else is one click away */
function headHTML(c) {
  const saved = savedOf(c), flag = needsYou(c);
  return `<span class="ch-top">
      <span class="ch-who"><b>${esc(c.provider)}</b><span>${esc(c.patient)}${flag ? ` · <span class="m3-status ${flag[1]}">${esc(flag[0])}</span>` : ''}</span></span>
      <span class="ch-saved ${saved ? '' : 'zero'}">${saved ? `<b>${money(saved)}</b><span>saved</span>` : '<span>Nothing saved yet</span>'}</span>
      ${icon('expand_more', 'chev')}
    </span>`;
}

/* first thing in the expanded card: status, billed -> now, and the next action */
function sumHTML(c) {
  const n = c.next || {};
  const down = c.current_balance < c.original;
  return `<div class="ch-meta">${statusChip(c)}<span class="muted">opened ${day(c.created)}</span></div>
    <span class="ch-money">${c.current_balance !== c.original
        ? `<span class="from">${money(c.original)} billed</span>${icon('arrow_forward', 'arrow')}<span class="now ${down ? 'down' : ''}">${money(c.current_balance)}</span>`
        : `<span class="now">${money(c.current_balance)}</span><span class="from">billed</span>`}
      ${c.refund ? `<span class="back">+ ${money(c.refund)} back to you</span>` : ''}
      ${c.target != null && c.target < c.current_balance && !c.confirmed ? `<span class="from">expected ${money(c.target)}${c.expected_refund ? ` + ${money(c.expected_refund)} back` : ''} once billing confirms</span>` : ''}</span>
    <span class="ch-next">${icon(n.overdue ? 'warning' : 'event')}<span class="nx"><span class="act">Next: ${esc(n.action || '')}</span>${when(n)}</span></span>`;
}

function actsHTML(c) {
  const n = c.next || {};
  const needsOk = c.status === 'awaiting_call_approval';
  const btn = needsOk ? `<a class="m3-btn filled" href="case.html?id=${c.id}">${icon('how_to_reg')}Approve on the case page</a>`
    : c.can_call_again ? `<button type="button" class="m3-btn ${n.overdue || n.due_today ? 'filled' : 'tonal'}" data-call="${c.id}">${icon('call')}Call again</button>` : '';
  return `${btn}<a class="m3-btn outlined" href="case.html?id=${c.id}">${icon('open_in_new')}Open case page</a>`;
}

/* expanded details: facts, calls, promises, follow-ups */
function detailHTML(c) {
  const last = c.last_call;
  const facts = [
    `<dt>Case number</dt><dd>${c.case_number ? `<b>${esc(c.case_number)}</b>` : '<span class="muted">none yet</span>'}</dd>`,
    `<dt>Last call</dt><dd>${last ? `${day(last.date)} · ${esc(last.rep || 'billing')}` : '<span class="muted">not called yet</span>'}</dd>`,
  ];
  if (c.plan && c.plan.months) facts.push(`<dt>Plan</dt><dd>${esc(c.plan.text || `${c.plan.months} × ${money(c.plan.monthly)}/mo`)} <span class="muted">interest-free</span></dd>`);

  const calls = c.calls.length ? `<ul class="m3-list">${c.calls.map((x) => `<li class="m3-list-item">
      <span class="li-leading">${icon('call')}</span>
      <span class="li-text"><span class="li-headline">${day(x.date)} · ${x.kind === 'followup' ? 'Follow-up call' : 'Call'} with ${esc(x.rep || 'billing')}${x.case_number ? ` · case ${esc(x.case_number)}` : ''}</span>
      <span class="li-support" style="display:block">${esc(x.summary || '')}</span></span></li>`).join('')}</ul>`
    : '<p class="none">No calls yet.</p>';

  const promised = c.calls.flatMap((x) => (x.promised || []).map((p) => ({ p, x })));
  const promises = promised.length ? `<ul class="m3-list">${promised.map(({ p, x }) => `<li class="m3-list-item">
      <span class="li-leading">${icon('handshake')}</span>
      <span class="li-text"><span class="li-headline">${esc(p)}</span>
      <span class="li-support" style="display:block">${esc(x.rep || 'Billing')} on ${day(x.date)}${x.timeframe_text ? ` · ${esc(x.timeframe_text)}` : ''}${x.follow_up_date ? ` · check back by ${day(x.follow_up_date)}${x.timeframe_assumed ? ' (no timeframe given; default 5 business days)' : ''}` : ''}</span></span></li>`).join('')}</ul>`
    : '<p class="none">No promises recorded yet.</p>';

  const fus = c.followups.length ? `<ul class="m3-list">${c.followups.map((f) => {
      const done = f.status === 'done';
      const overdue = !done && c.next && c.next.overdue && c.next.due === f.due;
      const chip = done ? `<span class="m3-status success">${icon('check')}Done</span>` : overdue ? '<span class="m3-status warn">Overdue</span>' : '<span class="m3-status info">Scheduled</span>';
      return `<li class="m3-list-item">
        <span class="li-text"><span class="li-headline">${esc(f.action || 'Follow-up')}</span>
        <span class="li-support" style="display:block">${done ? `Set ${day(f.created)} · closed by the call on ${day(f.closed)}` : `Set ${day(f.created)} · due ${day(f.due)}`}</span></span>
        <span class="li-trailing">${chip}</span></li>`; }).join('')}</ul>`
    : '<p class="none">No follow-ups scheduled.</p>';

  return `<dl class="facts">${facts.join('')}</dl>
    <div><h3 class="title-m sub-h">Calls</h3>${calls}</div>
    <div><h3 class="title-m sub-h">Promises</h3>${promises}</div>
    <div><h3 class="title-m sub-h">Follow-ups</h3>${fus}</div>`;
}

function clockHTML(c) {
  return `<span class="lbl">${icon('schedule')}Demo clock: <b>${day(c.today)}</b>${c.clock_days ? ` (+${c.clock_days} day${c.clock_days === 1 ? '' : 's'} simulated)` : ''}</span>
    <button type="button" class="m3-chip" data-clock="1" data-id="${c.id}">+1 day</button>
    <button type="button" class="m3-chip" data-clock="7" data-id="${c.id}">+1 week</button>
    ${c.next && c.next.due && !c.next.overdue ? `<button type="button" class="m3-chip" data-clock="due" data-id="${c.id}">Skip past due date</button>` : ''}
    ${c.clock_days ? `<button type="button" class="m3-chip" data-clock="reset" data-id="${c.id}">Reset</button>` : ''}`;
}

function ensureCard(c) {
  if (cards[c.id]) return cards[c.id];
  const el = document.createElement('article');
  el.className = 'm3-card case card'; el.id = 'case-' + c.id;
  el.innerHTML = `<button type="button" class="case-head" aria-expanded="false" aria-controls="body-${c.id}"><span class="main"></span></button>
    <div class="case-body" id="body-${c.id}" hidden>
      <div class="sum"></div>
      <div class="acts"></div>
      <div class="tl"></div>
      <div class="ask">
        <h3 class="title-m sub-h">Ask BillBack</h3>
        <form class="ask-row" data-ask="${c.id}"><input class="m3-input pill" name="q" type="text" placeholder="Ask about this case…" aria-label="Ask BillBack about this case" autocomplete="off"><button type="submit" class="m3-btn filled">Ask</button></form>
        <div class="chips"><button type="button" class="m3-chip" data-q="What's the status?">What's the status?</button><button type="button" class="m3-chip" data-q="When will you check back?">When will you check back?</button><button type="button" class="m3-chip" data-q="How much do I owe now?">How much do I owe now?</button></div>
        <div class="answer" aria-live="polite"></div>
      </div>
      <div class="clock"></div>
    </div>`;
  $('cases').appendChild(el);
  return (cards[c.id] = el);
}

function setOpen(el, open) {
  el.querySelector('.case-head').setAttribute('aria-expanded', String(open));
  el.querySelector('.case-body').hidden = !open;
}

function render(list) {
  const has = list.length > 0;
  $('casesTitle').hidden = !has;
  if (!has) { location.replace('new.html'); return; }  // nothing to list yet: start with the chat
  const ids = new Set(list.map((c) => c.id));
  Object.keys(cards).forEach((id) => { if (!ids.has(id)) { cards[id].remove(); delete cards[id]; } });
  // cases that need the patient first, then biggest savings (stable, so equal savings keep the newest-first order)
  list = [...list].sort((a, b) => !needsYou(b) - !needsYou(a) || savedOf(b) - savedOf(a));
  list.forEach((c, i) => {
    const fresh = !cards[c.id];
    const el = ensureCard(c);
    if ($('cases').children[i] !== el) $('cases').insertBefore(el, $('cases').children[i] || null);
    el.classList.toggle('overdue', !!(c.next && c.next.overdue));
    el._case = c;
    // open what needs attention, unless the user has already toggled this case
    if (!el._touched && (fresh || needsYou(c))) setOpen(el, !!needsYou(c));
    setHTML(el.querySelector('.main'), headHTML(c));
    setHTML(el.querySelector('.sum'), sumHTML(c));
    setHTML(el.querySelector('.acts'), actsHTML(c));
    setHTML(el.querySelector('.tl'), detailHTML(c));
    setHTML(el.querySelector('.clock'), clockHTML(c));
  });
}

async function refresh() {
  try { render(await (await fetch('/api/dashboard')).json()); } catch (e) {}
}

async function ask(id, q) {
  const el = cards[id]; if (!el || !q) return;
  const box = el.querySelector('.answer'), btn = el.querySelector('.ask-row button');
  const av = `<span class="avatar">${icon('graphic_eq')}</span>`;
  btn.disabled = true;
  box.innerHTML = `${av}<p class="muted">Checking your case history…</p>`;
  try {
    const r = await (await fetch(`/api/cases/${id}/ask`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) })).json();
    box.innerHTML = `${av}<p>${esc(r.answer)}<small>“${esc(q)}” · answered from ${r.source === 'claude' ? 'the case history by Claude' : 'the case history'}</small></p>`;
  } catch (e) { box.innerHTML = `${av}<p>Sorry, I couldn't reach the server.</p>`; }
  btn.disabled = false;
}

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-ask]'); if (!f) return;
  e.preventDefault(); const q = f.q.value.trim(); f.q.value = ''; ask(f.dataset.ask, q);
});
document.addEventListener('click', async (e) => {
  const head = e.target.closest('.case-head');
  if (head) { const el = head.closest('.case'); el._touched = true; setOpen(el, head.getAttribute('aria-expanded') !== 'true'); return; }
  const chip = e.target.closest('[data-q]');
  if (chip) return ask(chip.closest('.card').id.slice(5), chip.dataset.q);
  const call = e.target.closest('[data-call]');
  if (call) {
    call.disabled = true;
    const r = await fetch(`/api/cases/${call.dataset.call}/call-again`, { method: 'POST' });
    if (r.ok) location.href = `case.html?id=${call.dataset.call}`; else { call.disabled = false; refresh(); }
    return;
  }
  const clk = e.target.closest('[data-clock]');
  if (clk) {
    const c = cards[clk.dataset.id]._case, v = clk.dataset.clock;
    const days = v === 'reset' ? null : v === 'due' ? Math.max(1, (c.next.days_left || 0) + 1) : +v;
    await fetch(`/api/cases/${clk.dataset.id}/clock`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ days }) });
    refresh();
  }
});
addEventListener('scroll', () => document.querySelector('.m3-top-app-bar').classList.toggle('scrolled', scrollY > 4), { passive: true });

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
